version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mlops-credits-api:local
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./artifacts/models:/app/artifacts/models:ro    # montar modelo durante desarrollo
      - ./artifacts/preprocessors:/app/artifacts/preprocessors:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
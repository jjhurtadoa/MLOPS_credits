version: '3.8'

services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    image: boston-housing-api: 1.0.0
    container_name: boston-housing-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - APP_NAME=Boston Housing API
      - APP_VERSION=1.0.0
    volumes:
      # Montar artifacts como read-only (opcional:  permite actualizar modelo sin rebuild)
      - ./artifacts/models:/app/artifacts/models: ro
      - ./artifacts/preprocessors:/app/artifacts/preprocessors:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network
    logging:
      driver: "json-file"
      options: 
        max-size: "10m"
        max-file: "3"

networks:
  app-network: 
    driver: bridge
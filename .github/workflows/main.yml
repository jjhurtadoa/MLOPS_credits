name: CI - Tests & Docker

on:
  push:  
    branches: [ main, develop ]
  pull_request:  
    branches: [ main ]

jobs:
  test:  
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:  
          python-version: '3.9'
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:  
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run pytest
        run: pytest tests/ -v

  docker:  
    name: Build & Test Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      
      - name:  Set up Git LFS
        run: |
          git lfs install
          git lfs pull
      
      - name: Build Docker image
        run: docker compose build api
      
      - name: Start services
        run: docker compose up -d
      
      - name:  Wait for containers to start
        run: sleep 10
      
      - name: Show container status
        run: docker compose ps
      
      - name:  Show API logs (initial)
        run: docker compose logs api
      
      - name:  Wait for API with retry
        run: |
          echo "🔍 Esperando a que la API inicie..."
          for i in {1..30}; do
            if curl -f http://localhost:8000/health 2>/dev/null; then
              echo "✅ API lista después de $((i*2)) segundos"
              exit 0
            fi
            echo "⏳ Intento $i/30..."
            sleep 2
          done
          echo "❌ API no respondió después de 60 segundos"
          echo "📋 Logs finales:"
          docker compose logs api
          exit 1
      
      - name: Health check
        run:  curl -f http://localhost:8000/health    
            
      - name: Show final logs
        if: always()
        run: docker compose logs api
      
      - name: Cleanup
        if: always()
        run: docker compose down
# src/configs/model_config.yaml

models:
  random_forest:
    enabled: true
    module: sklearn.ensemble        # ← NUEVO
    class:   RandomForestRegressor
    params:
      n_estimators:   100
      max_depth:   10
      min_samples_split:  5
      min_samples_leaf:  2
      random_state: 42
      n_jobs: -1
  
  xgboost:  
    enabled: true
    module: xgboost                 # ← NUEVO
    class:  XGBRegressor
    params:
      n_estimators:  100
      max_depth:  6
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
      n_jobs: -1
  
  lightgbm:
    enabled:   true
    module: lightgbm                # ← NUEVO
    class:  LGBMRegressor
    params:  
      n_estimators: 100
      max_depth: 10
      learning_rate: 0.1
      num_leaves: 31
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
      n_jobs: -1
      verbose: -1
  
  catboost:
    enabled: true
    module:  catboost
    class: CatBoostRegressor
    params:
      iterations: 100
      depth: 6
      learning_rate: 0.1
      random_state: 42
      verbose: False
  
  ridge:
    enabled: true
    module: sklearn.linear_model
    class: Ridge
    params: 
      alpha:   1.0
      random_state: 42
  
  elastic_net:
    enabled: true
    module:  sklearn.linear_model
    class: ElasticNet
    params:
      alpha:  1.0
      l1_ratio:  0.5
      random_state: 42
  
  mlp:
    enabled:  true
    module: sklearn.neural_network
    class: MLPRegressor
    params:
      hidden_layer_sizes: [100, 50]
      activation: relu
      max_iter: 1000
      random_state: 42

training:
  data_dir: data/interim
  target_column:   MEDV
  model_dir: artifacts/models
  mlflow:  
    experiment_name: boston_housing_models
    tracking_uri: artifacts/mlruns
    run_name_prefix: model
  metrics:
    - rmse
    - mae
    - r2
    - mape

validation:
  cv_folds: 5
  cv_scoring: neg_root_mean_squared_error
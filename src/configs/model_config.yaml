# ============================================================================
# MODEL CONFIGURATION - BASELINE
# 
# Filosofía: Usar parámetros por defecto de las librerías para comparación
# justa entre familias de modelos (árboles vs lineales vs redes neuronales).
# 
# Solo se especifican: 
#   - random_state: Para reproducibilidad
#   - n_jobs: Para velocidad (no afecta resultados)
#   - verbose: Para silenciar warnings
#
# Optimización de hiperparámetros se hace DESPUÉS con Optuna en el ganador.
# ============================================================================

models:
  # ==========================================================================
  # MODELOS BASADOS EN ÁRBOLES (hipótesis del EDA:  mejores para este dataset)
  # ==========================================================================
  
  random_forest:
    enabled: true
    module: sklearn.ensemble
    class: RandomForestRegressor
    params:
      random_state: 42
      n_jobs: -1
      # Resto:  DEFAULTS (n_estimators=100, max_depth=None, etc.)
  
  xgboost:  
    enabled: true
    module: xgboost
    class: XGBRegressor
    params:
      random_state:  42
      n_jobs:  -1
      # Resto:  DEFAULTS (max_depth=6, learning_rate=0.3, n_estimators=100, etc.)
  
  lightgbm:
    enabled:  true
    module: lightgbm
    class: LGBMRegressor
    params:  
      random_state: 42
      n_jobs: -1
      verbose: -1
      # Resto: DEFAULTS (num_leaves=31, learning_rate=0.1, n_estimators=100, etc.)
  
  catboost: 
    enabled: true
    module: catboost
    class:  CatBoostRegressor
    params:
      random_state:  42
      verbose: False
      # Resto: DEFAULTS (iterations=1000, depth=6, learning_rate=0.03, etc.)
  
  # ==========================================================================
  # MODELOS LINEALES (para validar hipótesis)
  # ==========================================================================
  
  ridge:
    enabled:  true
    module: sklearn.linear_model
    class: Ridge
    params: 
      random_state: 42
      # Resto: DEFAULTS (alpha=1.0)
  
  elastic_net: 
    enabled: true
    module: sklearn.linear_model
    class: ElasticNet
    params:
      random_state:  42
      max_iter: 10000  # Evitar warning de convergencia
      # Resto:  DEFAULTS (alpha=1.0, l1_ratio=0.5)
  
  # ==========================================================================
  # REDES NEURONALES (para experimentación)
  # ==========================================================================
  
  mlp: 
    enabled:  true
    module: sklearn.neural_network
    class: MLPRegressor
    params:
      random_state: 42
      max_iter: 1000  # Evitar warning de convergencia
      # Resto: DEFAULTS (hidden_layer_sizes=(100,), activation='relu', etc.)

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================

training:
  data_dir: data/interim
  target_column: MEDV
  model_dir: artifacts/models
  
  mlflow:  
    experiment_name: boston_housing_models
    tracking_uri: artifacts/mlruns
    run_name_prefix: model
  
  metrics:
    - rmse
    - mae
    - r2
    - mape

# ============================================================================
# VALIDATION CONFIGURATION
# ============================================================================

validation:
  cv_folds: 5
  cv_scoring: neg_root_mean_squared_error